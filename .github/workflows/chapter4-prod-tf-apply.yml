name: chapter4-prod Terraform Apply

# dev ブランチへのマージ時に infra/ 以下に変更があれば自動で terraform apply を実行する。
# PR では chapter4-prod-tf-plan.yml で plan を確認済みの前提。
on:
  push:
    branches:
      - dev
    paths:
      - "chapter4-prod/infra/**"

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chapter4-prod/infra

    permissions:
      contents: read
      id-token: write # 将来の Workload Identity Federation 移行に備えて設定しておく

    steps:
      - uses: actions/checkout@v4

      # サービスアカウントキーで GCP に認証する。
      # terraform apply には plan より多くの権限が必要（run.admin, secretmanager.admin 等）。
      # 必要なロールは infra/main.tf の github_actions_apply_roles で定義している。
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # -auto-approve: 対話的な確認プロンプトをスキップする（CI 用）。
      #   PR の plan レビューで変更内容は確認済みの前提で自動承認する。
      # -no-color: ログ出力から ANSI エスケープコードを除去する。
      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_elastic_api_key: ${{ secrets.ELASTIC_API_KEY }}
          TF_VAR_qdrant_cloud_api_key: ${{ secrets.QDRANT_CLOUD_API_KEY }}
          TF_VAR_qdrant_cloud_account_id: ${{ vars.QDRANT_CLOUD_ACCOUNT_ID }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
