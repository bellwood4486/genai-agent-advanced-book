# PR コメントに `/deploy` と書くと、その PR ブランチのコードで
# Docker イメージをビルドし、Artifact Registry に :latest で push する。
# マージ前に Cloud Run Job やサービスの動作確認をしたいときに使う。
#
# 注意: :latest タグを上書きするため、同時に複数 PR で使うと競合する。
# このプロジェクトは 1 人開発のため許容している。

name: chapter4-prod Deploy (PR)

on:
  issue_comment:
    types: [created]

jobs:
  docker-build-push:
    # issue_comment は Issue と PR 両方で発火する。
    # PR のコメントだけに絞るために pull_request の存在をチェックする。
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/deploy')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chapter4-prod

    permissions:
      contents: read
      id-token: write
      # コメントの更新（updateComment）に必要
      pull-requests: write

    steps:
      # ワークフロー開始直後に /deploy コメントを「実行中」状態に更新する。
      # 以降のステップでも同じ comment_id を更新し続けることで進捗を表示する。
      - name: Report started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              body: [
                '🚀 `/deploy` を実行中...',
                '',
                '- [ ] PR ブランチ取得',
                '- [ ] ビルド',
                '- [ ] Artifact Registry へ push',
              ].join('\n'),
            });

      # issue_comment イベントではデフォルトブランチが checkout される。
      # PR のブランチを checkout するために、まず PR のメタデータを取得する。
      - name: Get PR branch
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);

      - name: Report branch fetched
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.pr.outputs.sha }}'.substring(0, 7);
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              body: [
                '🚀 `/deploy` を実行中...',
                '',
                `- [x] PR ブランチ取得 (\`${{ steps.pr.outputs.ref }}\` @ \`${sha}\`)`,
                '- [ ] ビルド',
                '- [ ] Artifact Registry へ push',
              ].join('\n'),
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.AR_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/helpdesk/helpdesk-agent:${{ steps.pr.outputs.sha }} \
            -t ${{ vars.AR_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/helpdesk/helpdesk-agent:latest \
            .

      - name: Report build done
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.pr.outputs.sha }}'.substring(0, 7);
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              body: [
                '🚀 `/deploy` を実行中...',
                '',
                `- [x] PR ブランチ取得 (\`${{ steps.pr.outputs.ref }}\` @ \`${sha}\`)`,
                '- [x] ビルド',
                '- [ ] Artifact Registry へ push',
              ].join('\n'),
            });

      - name: Push Docker image
        run: |
          docker push ${{ vars.AR_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/helpdesk/helpdesk-agent:${{ steps.pr.outputs.sha }}
          docker push ${{ vars.AR_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/helpdesk/helpdesk-agent:latest

      # 全ステップ成功時の最終更新
      - name: Report success
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.pr.outputs.sha }}'.substring(0, 7);
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              body: [
                '✅ `/deploy` 完了',
                '',
                `- [x] PR ブランチ取得 (\`${{ steps.pr.outputs.ref }}\` @ \`${sha}\`)`,
                '- [x] ビルド',
                `- [x] Artifact Registry へ push (\`${sha}\` / \`:latest\`)`,
              ].join('\n'),
            });

      # いずれかのステップが失敗したときの更新
      # if: failure() により、上記ステップが失敗した場合のみ実行される
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              body: [
                '❌ `/deploy` 失敗',
                '',
                `詳細は [Actions ログ](${runUrl}) を確認してください。`,
              ].join('\n'),
            });
