[project]
name = "chapter4-prod"
version = "0.1.0"
description = "Helpdesk AI agent for GCP production deployment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>1.68",
    "langgraph==0.2.14",
    "pydantic-settings==2.4.0",
    "langchain>=0.2.15,<0.3.0",
    "elasticsearch==8.15.0",
    "pypdf==4.3.1",
    "langchain-community==0.2.13",
    "langchain-text-splitters==0.2.2",
    "qdrant-client==1.11.1",
]
[dependency-groups]
dev = [
    "ruff>=0.11.4",
    "ipykernel==6.29.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 119
indent-width = 4
target-version = "py312"
extend-include = ["*.ipynb"]
exclude = [".ruff_cache"]

[tool.ruff.lint]
select = [
    "F", # Flake8
    "B", # Black
    "I", # isort
    "E", # error
    "W", # warning
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
